      GenerationJob，经 App 侧稳定的 registerCompletedImageJob（useCallback 空依赖 + 按
      localOutputPath 幂等）登记，登记不进入轮询 effect 依赖数组。证据覆盖：Z-Image/H3-Image/FireRed
      三条登记链路在隔离浏览器上下文中以真实工作区组件 + mock 桥接驱动实测（含 Z-Image
      提交时快照语义、保存失败不登记、StrictMode/重渲染幂等、生成中不入库、完成后 result
      与发送按钮不受影响）；视频库与队列标签一致、来源兜底正确、文件夹按钮仅对有 localOutputPath 的图片卡片显示且调用
      showOutput(localOutputPath)；electron shell:show-output
      守卫用真实源码在临时目录执行验证（文件被移走不建同名目录）。命令类检查 typecheck/lint/build:web
