    source: brief.md
    text: H3-Image 工作区生成一张图片并保存成功后，App 的 jobs 状态新增 provider 为 h3image、mediaType 为
      image、status 为 completed 的记录，localOutputPath 指向 Created Images
      留存，outputUrl 是 minimax-media 短 URL（非 data URL），视频库图片筛选与队列历史出现该条目且提示词可搜索命中。
    result: passed
    reason:
      text: 在隔离浏览器上下文（端口 5211，独立 localStorage）mock ComfyUI 桥接后真实驱动 H3-Image
        工作区：提交→轮询→getOutputImage→saveComfyOutputImage→mediaUrl 全链路跑通，jobs 持久化中新增
        {provider:'h3image', mediaType:'image', status:'completed',
        mode:'image', progress:100, duration:0, promptId:'h3-probe-1',
        prompt:'h3probe original prompt', width:1344, height:768,
        localOutputPath:'C:\out\Created Images\created-image-h3probe.png',
        outputUrl:'minimax-media://selected?path=...'};outputUrl 为 minimax-media
        短 URL，localStorage 中不含 base64/data
        URL；视频库图片筛选与队列视图均出现该条目，搜索提示词可命中。代码路径核对：App.registerCompletedImageJob
        (useCallback 空依赖) 按 localOutputPath 幂等去重，H3ImageWorkspace 通过
        registerJobRef 调用（不进轮询 effect 依赖）。
      truncated: false
