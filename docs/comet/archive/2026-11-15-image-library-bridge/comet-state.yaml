        width=1920, height=1080，证明登记取提交时快照（updateJob 在 create() 中写入
        {id,url,prompt,width,height}，poll 分支只读 job.*）。宽高非
        0，条目在视频库与队列历史可见、提示词搜索可命中。
      truncated: false
