runcated":false},"result":"passed","source":"brief.md","text":"**A2 排队任务取消**：mmh3 已有任务在跑时再提交一个并点取消 → 引擎直接 `cancelled`、任务不起跑、不占 GPU；卡片显示「未开始执行，已取消」。"},{"id":"A3","reason":{"text":"末步窗口如实记 done 复用 Run 内 iteration-1 实机证据（临时端口 8890 新二进制，已记录）（iteration-1 实机确认）；本轮代码：cancelTooLate = discard && interruptAccepted → 保留产物、标签「已完成（取消来得太晚：引擎在最后一步后完成）」（src/App.tsx）。","truncated":false},"result":"passed","source":"brief.md","text":"**A3 末步窗口如实呈现**：取消落在最后一步之后、引擎返回 `done` → 卡片显示完成并保留产物入库，不显示取消成功。"},{"id":"A4","reason":{"text":"旧实例（404/405）→ interrupted:false → 落入既有软取消文案「mmh3 无法中断，仍在占用 GPU」，result.error 不渲染（src/App.tsx handleCancel、H3ImageWorkspace.tsx:361-380）；常驻 8888/8889 实测仍为旧二进制（/v1/status 无 weights/cancelling 字段）。","truncated":false},"result":"passed","source":"brief.md","text":"**A4 旧引擎降级**：对不支持 interrupt 的实例（常驻旧二进制）点取消 → 沿用既有提示「mmh3 无法中断，仍在占用 GPU」，跑完后产物丢弃不入库；界面不出现原始 HTTP 错误文案。"},{"id":"A5","reason":{"text":"渲染层为本轮新增：weightLine 输出「实际权重：{dit}（指纹 …）+ {adapter}（指纹 …）（实例口径指纹，非完整性校验）」（src/lib/engine/engineHealth.ts:55-63），经 engineHealthLine→EngineSelector 状态行（role=status）呈现；fast 实例权重独立查询并同屏（useEngineSelection checkEngine 传 fastStatus）；busy=无 dit 条目→「● 正忙」而非异常/缺失（engineHealth.ts busy 判定）。引擎侧 weights/正忙语义复用 Run 内 iteration-1 实机证据（临时端口 8890 新二进制，已记录）。","truncated":false},"result":"passed","source":"brief.md","text":"**A5 实例实际权重徽标**：引擎徽标显示实例实际加载的 DiT 与适配器（patch/LoRA 文件名）；主实例与极速实例可据此区分；digest 以「实例口径指纹，非完整性校验」呈现；实例正忙（weights 无 dit 条目）时显示「正忙」而非「异常」或「模型缺失」。"},{"id":"A6","reason":{"text":"档位可用性/缺失文件/画布约束来自 GET /v1/recipes（useMmh3Recipes、mmh3TierAvailabilityMap）；所有 available=false 档位的缺失文件名常显于帮助区（App.tsx Inspector missingTierNotes，修复上轮只显示「模型缺失」不点名文件）；提交时 serverOptions 原样透传、仅滤机器级选项（mmh3Task.ts mmh3VideoRequest；G5 断言 fromServer 快照 + 机器选项过滤；mmh3Fields 不改键名 electron/main.ts:66）。未连接时标注「未连接引擎，按本地配方显示」。九条配方契约复用 Run 内 iteration-1 实机证据（临时端口 8890 新二进制，已记录）。","truncated":false},"result":"passed","source":"brief.md","text":"**A6 配方以服务端为准**：档位可用性、缺文件提示与画布约束来自 `GET /v1/recipes`；某档缺文件时显示「模型缺失」并指名缺哪个文件、该档不可提交，