8889 常驻实例仍是旧二进制（无 weights/recipes 字段），部署由用户决定。","生图取消接入真中断后，末步窗口（取消后仍 done）的产物不入库但会留在服务端，由既有孤儿清理路径处理；视频路径已区分并保留产物。"],"requireIndependentReview":true,"summary":"修复验收指出的 6 项 fail 与 2 项高风险：(1) A9 关键缺陷——frame-index 由空格拼接单字段改为每个锚点一条独立的可重复字段（新增 Mmh3RepeatField，贯通 mmh3Api/main/preload/types/mmh3Task，submit() 逐条 append；G5 门禁改为断言 repeats 且显式禁止拼接编码）；(2) A5/A22——权重 digest 值现于状态行 DiT 与各适配器旁渲染（「指纹 <16位>（实例口径指纹，非完整性校验）」），主/极速实例均适用；(3) A6——档位选择器帮助区常显所有 available=false 档位的缺失文件清单，不再只对选中档可见；(4) A10/A19——新增引擎表单补极速实例地址输入；删除当前默认引擎改为允许并在确认文案中说明回落 ComfyUI；(5) fast 档取消端口错位——GenerationJob 记录提交实例 mmh3BaseUrl，取消时对提交实例发起 interrupt；(6) H3 生图取消接入真中断（受理则停，旧引擎回落软取消文案）。","verificationChecks":[{"argv":["scripts/test-engine-routing.cjs"],"cwdRef":".","executable":"node","id":"engine-routing-gates","name":"引擎路由与契约门禁","repeatable":true,"timeoutMs":120000},{"argv":["tsc","--noEmit"],"cwdRef":".","executable":"npx","id":"typecheck-renderer","name":"渲染进程类型检查","repeatable":true,"timeoutMs":600000},{"argv":["tsc","-p","tsconfig.electron.json","--noEmit"],"cwdRef":".","executable":"npx","id":"typecheck-electron","name":"主进程类型检查","repeatable":true,"timeoutMs":600000},{"argv":["eslint",".","--max-warnings","0"],"cwdRef":".","executable":"npx","id":"lint","name":"ESLint（零警告）","repeatable":true,"timeoutMs":600000},{"argv":["scripts/locale-audit.cjs"],"cwdRef":".","executable":"node","id":"locale-audit","name":"界面文案审计","repeatable":true,"timeoutMs":120000},{"argv":["vite","build"],"cwdRef":".","executable":"npx","id":"build-web","name":"渲染端构建","repeatable":true,"timeoutMs":600000},{"argv":["scripts/test-h3-image.cjs"],"cwdRef":".","executable":"node","id":"h3-image-suite","name":"H3 生图回归套件","repeatable":true,"timeoutMs":120000},{"argv":["scripts/test-workflows.cjs"],"cwdRef":".","executable":"node","id":"workflows-suite","name":"工作流构建回归套件","repeatable":true,"timeoutMs":120000},{"argv":["scripts/test-job-persistence.cjs"],"cwdRef":".","executable":"node","id":"job-persistence-suite","name":"任务持久化回归套件","repeatable":true,"timeoutMs":120000}]}},{"sequence":4,"value":{"choice":"approved","proposal":{"input":{"artifactRootRef":"docs","name":"mmh3-engine-v2-wiring","task":"接线 mmh3 引擎侧 v2 契约到 DavAi：E1 真中断（POST /v1/generations/{id}/interrupt、cancelling/cancelled 状态、/v1/status.cancelling 字段）、E2 GET /v1/recipes（九条配方，options 键名即 POST 表单字段、可原样拷贝）、E3 turbo8 档位修正（换 768p LoRA + shift 6/3，画布与 shift 成对换）、E12 /v1/status weights 权重指纹（digest 非校验和、busy 时无 dit 条目）、E14 step_seconds（进度 ETA）、E6 keyframe 多锚点（可重复 keyframe + frame-index，与 first/last 及 reference 互斥），并补应用侧收窄项：引擎新增/删除管理 UI、切换引擎时参数重置。契约来源文档：/home/dawo/orca/projects/mmh3/mmh3-davai 的 docs/server.md、docs/usage.md、docs/lightx2v-turbo.md、docs/fl2va.md、docs/davai-integration-gaps.zh.md（feature/davai-integration @ eba2c21）。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"**A1 真中断（运行中取消，引擎支持时）**：mmh3 视频任务运行中点取消 → 应用调用 `POST /v1/generations/{id}/interrupt` → 卡片状态行显示「正在停止（当前步跑完后生效）」→ 引擎进入 `cancelling` → 终态 `cancelled`：产物不落库、远端副本按既有清理路径处置。实机：新二进制临时实例跑通一次。"},{"id":"A2","source":"brief.md","text":"**A2 排队任务取消**：mmh3 已有任务在跑时再提交一个并点取消 → 引擎直接 `cancelled`、任务不起跑、不占 GPU；卡片显示「未开始执行，已取消」。"},{"id":"A3","source":"brief.md","text":"**A3 末步窗口如实呈现**：取消落在最后一步之后、引擎返回 `done` → 卡片显示完成并保留产物入库，不显示取消成功。"},{"id":"A4","source":"brief.md","text":"**A4 旧引擎降级**：对不支持 interrupt 的实例（常驻旧二进制）点取消 → 沿用既有提示「mmh3 无法中断，仍在占用 GPU」，跑完后产物丢弃不入库；界面不出现原始 HTTP 错误文案。"},{"id":"A5","source":"brief.md","text":"**A5 实例实际权重徽标**：引擎徽标显示实例实际加载的 DiT 与适配器（patch/LoRA 文件名）；主实例与极速实例可据此区分；digest 以「实例口径指纹，非完整性校验」呈现；实例正忙（weights 无 dit 条目）时显示「正忙」而非「异常」或「模型缺失」。"},{"id":"A6","source":"brief.md","text":"**A6 配方以服务端为准**：档位可用性、缺文件提示与画布约束来自 `GET /v1/recipes`；某档缺文件时显示「模型缺失」并指名缺哪个文件、该档不可提交，其余档正常；提交时配方字段原样透传（键名与值不被应用改写）。"},{"id":"A7","source":"brief.md","text":"**A7 turbo8 画布配对**：1344×768 画布下 turbo8 使用 `minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors` + steps 8 + shift-video 6 / shift-audio 3 + attention sol + attention-precision int8-fp8 + sparse-start 0；960×544 画布下 turbo8 使用 turbo8-544p 条目；其他画布不提供 turbo8，且档位选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A8","source":"brief.md","text":"**A8 ETA**：mmh3 任务进度显示按 `step_seconds × 剩余步数` 估算的剩余时间；`step_seconds` 缺失时退回既有展示，不显示错误值。"},{"id":"A9","source":"brief.md","text":"**A9 多锚点 keyframe**：H3 视频提交区可按帧序号添加多个锚点图（选该模式后首帧/尾帧入口不可用并说明原因）；提交时表单带成对的 `keyframe`/`frame-index`；实机抽帧核对锚定帧与锚图一致。"},{"id":"A10","source":"brief.md","text":"**A10 引擎增删**：设置页可新增自定义 mmh3 引擎条目（label/baseUrl/fastBaseUrl）与删除自定义条目（预置 ComfyUI/mmh3 条目不可删，删除前有确认）；新增后 H3 选择器立即可用，删除后回落默认引擎。"},{"id":"A11","source":"brief.md","text":"**A11 切换引擎参数重置**：从 mmh3 切到 ComfyUI（或反之）时，不适用于新引擎的档位与参数重置为该引擎默认值，不带着旧值提交。"},{"id":"A12","source":"brief.md","text":"**A12 提交失败文案（R2）**：提交超时不再呈现原始 `TypeError: fetch failed`，改为带修复指引的失败文案。"},{"id":"A13","source":"brief.md","text":"**A13 引擎选择跨重启（R3）**：应用重启后 H3 两处引擎选择恢复为上次选择，首屏不闪 comfy。"},{"id":"A14","source":"brief.md","text":"**A14 非 H3 零回归与门禁**：`pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 全绿；既有 `scripts/test-engine-routing.cjs` 六条门禁仍 PASS 且新增契约门禁 PASS；其他工作区行为零变化。"},{"id":"A15","source":"specs/mmh3-engine-integration/spec.md","text":"首次启动无新字段 升级后首次启动（设置文件无 `engines`/`activeEngineId`）：H3 选择器默认显示 ComfyUI，其余一切工作区行为与本 change 之前**行为级一致**（行为等价，不做逐字节比对）。"},{"id":"A16","source":"specs/mmh3-engine-integration/spec.md","text":"首启幂等合成 升级后首启（存量设置只有 `comfyUrl`）：合成 `engines=[comfy(镜像), mmh3(默认本机地址)]`、`activeEngineId='comfy'`；再次启动不重复改写；一切非 H3 行为与改动前一致。"},{"id":"A17","source":"specs/mmh3-engine-integration/spec.md","text":"保存单通道 设置页把 `comfyUrl` 从 A 改为 B 保存：一次写盘同时落 `comfyUrl=B` 与 `engines[comfy].baseUrl=B`；反向编辑 comfy 条目 baseUrl 同理；两次保存之间不存在不一致窗口，也不出现第二次写盘提示。"},{"id":"A18","source":"specs/mmh3-engine-integration/spec.md","text":"引擎可见可管理 用户在设置页看到 ComfyUI 与 mmh3 两条预置条目，可改 mmh3 的 baseUrl 指向另一本机端口，保存后 H3 选择器随即使用新地址；不重启应用生效。"},{"id":"A19","source":"specs/mmh3-engine-integration/spec.md","text":"自定义引擎可增删（验收：A10） 设置页新增一条名为「mmh3-实验」的自定义 mmh3 引擎（地址填本机另一端口）：保存后 H3 视频与 H3 生图的引擎选择器出现该条目，状态徽标按其地址独立预检；在设置页删除它并确认：条目消失，若它是当前选择则回落 ComfyUI，预置两条目始终存在且无删除入口。"},{"id":"A20","source":"specs/mmh3-engine-integration/spec.md","text":"离线置灰 停掉本机 `mmh3.service` 后打开 H3 视频工作区：mmh3 选项在数秒内置灰、状态行显示离线原因；ComfyUI 选项不受影响且可正常生成。"},{"id":"A21","source":"specs/mmh3-engine-integration/spec.md","text":"模型缺失 mmh3 可达但实例的模型树缺某配方文件（如 patches 下无 FastH3 patch）：选择器显示 `○ 模型缺失` 并注明缺哪个文件；该档位不可提交，其余档位正常。"},{"id":"A22","source":"specs/mmh3-engine-integration/spec.md","text":"实际权重可见（验收：A5） mmh3 实例可达且空闲：状态行显示该实例实际加载的 DiT 文件名与适配器（如 `fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors` + 其 patch/LoRA）；切到极速档时状态行显示的是 `:8889` 自己的权重而非主实例的；权重指纹旁注明「实例口径指纹，非完整性校验」；实例正在渲染时状态行显示「● 正忙」而非「模型缺失」。"},{"id":"A23","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 4 走 mmh3 选择 mmh3 + Turbo 4 档提交 1344×768/5 秒：请求发往 `http://127.0.0.1:8888/v1/generations`，multipart 含上表字段；完成后媒体库出现带 mmh3 徽标的 MP4。"},{"id":"A24","source":"specs/mmh3-engine-integration/spec.md","text":"fast 档路由第二实例 选择极速 fast 档提交：请求发往 `:8889`；主实例（:8888）不参与该任务；fast 档 UI 标注来源实例。"},{"id":"A25","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 8 画布配对（验收：A7） 画布为 1344×768 时选 Turbo 8：multipart 含 `lora=minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors`、`steps=8`、`shift-video=6`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`（配方快照门禁 G5 断言字段）。画布改为 960×544：Turbo 8 落到 `turbo8-544p` 条目（缺该 LoRA 时显示「模型缺失」并禁用提交）。画布改为 1344×576 或竖屏/方形：Turbo 8 不出现在可选档位中，选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A26","source":"specs/mmh3-engine-integration/spec.md","text":"PDMD 专属档 选择 PDMD 2 步档提交：multipart 含 `lora=minimax_h3_pdmd_2step_lora_rank128_bf16.safetensors`、`steps=2`、`shift-video=12`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`；UI 徽标区分「mmh3 专属」，该档不出现在 ComfyUI 引擎选项中（G5 断言字段 + 实机抽测出片）。"},{"id":"A27","source":"specs/mmh3-engine-integration/spec.md","text":"角色身份图同引擎 角色工作室的身份图批量生成提交点在 mmh3 引擎下按生图路径（§5）分派，不构造 ComfyUI graph。"},{"id":"A28","source":"specs/mmh3-engine-integration/spec.md","text":"mmh3 生图入库 mmh3 引擎下 1024×1024/6 步生图完成：PNG 落地本地 outputDirectory、登记 `GenerationJob`（`provider: 'h3image'`、`engineId: 'mmh3'`）、媒体库可见可删除，与 ComfyUI 生图条目同构。"},{"id":"A29","source":"specs/mmh3-engine-integration/spec.md","text":"排队可见 在 mmh3 已有一个 running 任务时再提交一个：第二个任务卡片显示排队位置；第一个完成后第二个自动开始并正常完成。排队状态以 `role=\"status\"` 呈现并在状态变化时播报一次，不高频刷新。"},{"id":"A30","source":"specs/mmh3-engine-integration/spec.md","text":"真中断不落库（验收：A1、A2、A3） mmh3 任务运行中点取消：卡片转「正在停止（当前步跑完后生效）」，引擎进入 `cancelling` 后转 `cancelled` 终态；服务端完成后媒体库**不**出现该产物，远端副本被清理。若取消落在最后一步之后、引擎已返回 `done`，卡片显示完成并保留产物入库——不谎报取消成功。排队中的任务被取消时直接 `cancelled`、不起跑、不占 GPU。"},{"id":"A31","source":"specs/mmh3-engine-integration/spec.md","text":"旧引擎软取消降级（验收：A4） 对不支持 interrupt 的实例点取消：卡片转取消态并出现「mmh3 无法中断，仍在占用 GPU」提示；服务端完成后媒体库不出现该产物，远端副本被清理；界面不出现原始 HTTP 错误文案。"},{"id":"A32","source":"specs/mmh3-engine-integration/spec.md","text":"降级标注 mmh3 任务的卡片与详情不出现「放大」等操作入口，原入口位置显示禁用态与原因 tooltip（禁用态与原因以 `role=\"status\"` 呈现，仅在状态变化时播报）；同一产物拖入 ComfyUI 引擎的 H3 任务作首帧则正常可用。"},{"id":"A33","source":"specs/mmh3-engine-integration/spec.md","text":"删除与引用检测照常 删除一条 mmh3 视频产物：文件进回收站、记录移除；当它被影片项目引用时删除被阻止并提示引用位置——与 ComfyUI 产物行为一致。"},{"id":"A34","source":"specs/mmh3-engine-integration/spec.md","text":"交接释放 ComfyUI 刚完成一次 H3 生成后立刻选 mmh3 提交：应用先查队列（空）、发 `/free`、等 mmh3 确认可达，然后提交成功；状态行按序显示上述阶段。"},{"id":"A35","source":"specs/mmh3-engine-integration/spec.md","text":"全量回归绿 `pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 在本 change 全部改动下通过；`test-engine-routing.cjs` 门禁逐条通过。"}],"children":null,"formalHash":"29b7df6e855c54707404d6450f476efbf2018357aef428fbe0bb26b03a5381c5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"9ab37e527c306e0acfb388db36ac8c12956cc9a7832bba935726b586ce82150c","contractHash":"c5f756bba2ed05b6865aacf51a3d34a8a6d6c202d05a3b0f1d81c31f1fa60280","inputHash":"63b852c687f3e53cf4656833b69845f20fc8798a46480c8f029dd32ac9fdd5ea","legacyFingerprint":"f120b7cb5344e74a640681dc296335f18905c413745c71d09a95ffaa91cfc593","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"10486058776198b1b352fc0eb0b34e829a9e148ee99012d50dd8060752865677","contractHash":"ef6ca3509e33db2052f39ee5a9183715c11596054f020abd3a31eba3ff841add","inputHash":"d3d9ad493542c65b815894b0d09095e5b3a76d131460e5cdb7becf9c15e354e5","legacyFingerprint":"b150766158d2412c839214c3c3f8b1e1f9638313fe9567c04a30f06f0e92a7ba","source":"specs/mmh3-engine-integration/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"e6db16a25189cb9b4e5040b01cd2289f87da35e7273720fe2ad8880a833ed667","specChanges":[{"capability":"mmh3-engine-integration","operation":"modify","source":"specs/mmh3-engine-integration/spec.md"}]}}}}},{"sequence":3,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"**A1 真中断（运行中取消，引擎支持时）**：mmh3 视频任务运行中点取消 → 应用调用 `POST /v1/generations/{id}/interrupt` → 卡片状态行显示「正在停止（当前步跑完后生效）」→ 引擎进入 `cancelling` → 终态 `cancelled`：产物不落库、远端副本按既有清理路径处置。实机：新二进制临时实例跑通一次。"},{"id":"A2","source":"brief.md","text":"**A2 排队任务取消**：mmh3 已有任务在跑时再提交一个并点取消 → 引擎直接 `cancelled`、任务不起跑、不占 GPU；卡片显示「未开始执行，已取消」。"},{"id":"A3","source":"brief.md","text":"**A3 末步窗口如实呈现**：取消落在最后一步之后、引擎返回 `done` → 卡片显示完成并保留产物入库，不显示取消成功。"},{"id":"A4","source":"brief.md","text":"**A4 旧引擎降级**：对不支持 interrupt 的实例（常驻旧二进制）点取消 → 沿用既有提示「mmh3 无法中断，仍在占用 GPU」，跑完后产物丢弃不入库；界面不出现原始 HTTP 错误文案。"},{"id":"A5","source":"brief.md","text":"**A5 实例实际权重徽标**：引擎徽标显示实例实际加载的 DiT 与适配器（patch/LoRA 文件名）；主实例与极速实例可据此区分；digest 以「实例口径指纹，非完整性校验」呈现；实例正忙（weights 无 dit 条目）时显示「正忙」而非「异常」或「模型缺失」。"},{"id":"A6","source":"brief.md","text":"**A6 配方以服务端为准**：档位可用性、缺文件提示与画布约束来自 `GET /v1/recipes`；某档缺文件时显示「模型缺失」并指名缺哪个文件、该档不可提交，其余档正常；提交时配方字段原样透传（键名与值不被应用改写）。"},{"id":"A7","source":"brief.md","text":"**A7 turbo8 画布配对**：1344×768 画布下 turbo8 使用 `minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors` + steps 8 + shift-video 6 / shift-audio 3 + attention sol + attention-precision int8-fp8 + sparse-start 0；960×544 画布下 turbo8 使用 turbo8-544p 条目；其他画布不提供 turbo8，且档位选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A8","source":"brief.md","text":"**A8 ETA**：mmh3 任务进度显示按 `step_seconds × 剩余步数` 估算的剩余时间；`step_seconds` 缺失时退回既有展示，不显示错误值。"},{"id":"A9","source":"brief.md","text":"**A9 多锚点 keyframe**：H3 视频提交区可按帧序号添加多个锚点图（选该模式后首帧/尾帧入口不可用并说明原因）；提交时表单带成对的 `keyframe`/`frame-index`；实机抽帧核对锚定帧与锚图一致。"},{"id":"A10","source":"brief.md","text":"**A10 引擎增删**：设置页可新增自定义 mmh3 引擎条目（label/baseUrl/fastBaseUrl）与删除自定义条目（预置 ComfyUI/mmh3 条目不可删，删除前有确认）；新增后 H3 选择器立即可用，删除后回落默认引擎。"},{"id":"A11","source":"brief.md","text":"**A11 切换引擎参数重置**：从 mmh3 切到 ComfyUI（或反之）时，不适用于新引擎的档位与参数重置为该引擎默认值，不带着旧值提交。"},{"id":"A12","source":"brief.md","text":"**A12 提交失败文案（R2）**：提交超时不再呈现原始 `TypeError: fetch failed`，改为带修复指引的失败文案。"},{"id":"A13","source":"brief.md","text":"**A13 引擎选择跨重启（R3）**：应用重启后 H3 两处引擎选择恢复为上次选择，首屏不闪 comfy。"},{"id":"A14","source":"brief.md","text":"**A14 非 H3 零回归与门禁**：`pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 全绿；既有 `scripts/test-engine-routing.cjs` 六条门禁仍 PASS 且新增契约门禁 PASS；其他工作区行为零变化。"},{"id":"A15","source":"specs/mmh3-engine-integration/spec.md","text":"首次启动无新字段 升级后首次启动（设置文件无 `engines`/`activeEngineId`）：H3 选择器默认显示 ComfyUI，其余一切工作区行为与本 change 之前**行为级一致**（行为等价，不做逐字节比对）。"},{"id":"A16","source":"specs/mmh3-engine-integration/spec.md","text":"首启幂等合成 升级后首启（存量设置只有 `comfyUrl`）：合成 `engines=[comfy(镜像), mmh3(默认本机地址)]`、`activeEngineId='comfy'`；再次启动不重复改写；一切非 H3 行为与改动前一致。"},{"id":"A17","source":"specs/mmh3-engine-integration/spec.md","text":"保存单通道 设置页把 `comfyUrl` 从 A 改为 B 保存：一次写盘同时落 `comfyUrl=B` 与 `engines[comfy].baseUrl=B`；反向编辑 comfy 条目 baseUrl 同理；两次保存之间不存在不一致窗口，也不出现第二次写盘提示。"},{"id":"A18","source":"specs/mmh3-engine-integration/spec.md","text":"引擎可见可管理 用户在设置页看到 ComfyUI 与 mmh3 两条预置条目，可改 mmh3 的 baseUrl 指向另一本机端口，保存后 H3 选择器随即使用新地址；不重启应用生效。"},{"id":"A19","source":"specs/mmh3-engine-integration/spec.md","text":"自定义引擎可增删（验收：A10） 设置页新增一条名为「mmh3-实验」的自定义 mmh3 引擎（地址填本机另一端口）：保存后 H3 视频与 H3 生图的引擎选择器出现该条目，状态徽标按其地址独立预检；在设置页删除它并确认：条目消失，若它是当前选择则回落 ComfyUI，预置两条目始终存在且无删除入口。"},{"id":"A20","source":"specs/mmh3-engine-integration/spec.md","text":"离线置灰 停掉本机 `mmh3.service` 后打开 H3 视频工作区：mmh3 选项在数秒内置灰、状态行显示离线原因；ComfyUI 选项不受影响且可正常生成。"},{"id":"A21","source":"specs/mmh3-engine-integration/spec.md","text":"模型缺失 mmh3 可达但实例的模型树缺某配方文件（如 patches 下无 FastH3 patch）：选择器显示 `○ 模型缺失` 并注明缺哪个文件；该档位不可提交，其余档位正常。"},{"id":"A22","source":"specs/mmh3-engine-integration/spec.md","text":"实际权重可见（验收：A5） mmh3 实例可达且空闲：状态行显示该实例实际加载的 DiT 文件名与适配器（如 `fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors` + 其 patch/LoRA）；切到极速档时状态行显示的是 `:8889` 自己的权重而非主实例的；权重指纹旁注明「实例口径指纹，非完整性校验」；实例正在渲染时状态行显示「● 正忙」而非「模型缺失」。"},{"id":"A23","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 4 走 mmh3 选择 mmh3 + Turbo 4 档提交 1344×768/5 秒：请求发往 `http://127.0.0.1:8888/v1/generations`，multipart 含上表字段；完成后媒体库出现带 mmh3 徽标的 MP4。"},{"id":"A24","source":"specs/mmh3-engine-integration/spec.md","text":"fast 档路由第二实例 选择极速 fast 档提交：请求发往 `:8889`；主实例（:8888）不参与该任务；fast 档 UI 标注来源实例。"},{"id":"A25","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 8 画布配对（验收：A7） 画布为 1344×768 时选 Turbo 8：multipart 含 `lora=minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors`、`steps=8`、`shift-video=6`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`（配方快照门禁 G5 断言字段）。画布改为 960×544：Turbo 8 落到 `turbo8-544p` 条目（缺该 LoRA 时显示「模型缺失」并禁用提交）。画布改为 1344×576 或竖屏/方形：Turbo 8 不出现在可选档位中，选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A26","source":"specs/mmh3-engine-integration/spec.md","text":"PDMD 专属档 选择 PDMD 2 步档提交：multipart 含 `lora=minimax_h3_pdmd_2step_lora_rank128_bf16.safetensors`、`steps=2`、`shift-video=12`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`；UI 徽标区分「mmh3 专属」，该档不出现在 ComfyUI 引擎选项中（G5 断言字段 + 实机抽测出片）。"},{"id":"A27","source":"specs/mmh3-engine-integration/spec.md","text":"角色身份图同引擎 角色工作室的身份图批量生成提交点在 mmh3 引擎下按生图路径（§5）分派，不构造 ComfyUI graph。"},{"id":"A28","source":"specs/mmh3-engine-integration/spec.md","text":"mmh3 生图入库 mmh3 引擎下 1024×1024/6 步生图完成：PNG 落地本地 outputDirectory、登记 `GenerationJob`（`provider: 'h3image'`、`engineId: 'mmh3'`）、媒体库可见可删除，与 ComfyUI 生图条目同构。"},{"id":"A29","source":"specs/mmh3-engine-integration/spec.md","text":"排队可见 在 mmh3 已有一个 running 任务时再提交一个：第二个任务卡片显示排队位置；第一个完成后第二个自动开始并正常完成。排队状态以 `role=\"status\"` 呈现并在状态变化时播报一次，不高频刷新。"},{"id":"A30","source":"specs/mmh3-engine-integration/spec.md","text":"真中断不落库（验收：A1、A2、A3） mmh3 任务运行中点取消：卡片转「正在停止（当前步跑完后生效）」，引擎进入 `cancelling` 后转 `cancelled` 终态；服务端完成后媒体库**不**出现该产物，远端副本被清理。若取消落在最后一步之后、引擎已返回 `done`，卡片显示完成并保留产物入库——不谎报取消成功。排队中的任务被取消时直接 `cancelled`、不起跑、不占 GPU。"},{"id":"A31","source":"specs/mmh3-engine-integration/spec.md","text":"旧引擎软取消降级（验收：A4） 对不支持 interrupt 的实例点取消：卡片转取消态并出现「mmh3 无法中断，仍在占用 GPU」提示；服务端完成后媒体库不出现该产物，远端副本被清理；界面不出现原始 HTTP 错误文案。"},{"id":"A32","source":"specs/mmh3-engine-integration/spec.md","text":"降级标注 mmh3 任务的卡片与详情不出现「放大」等操作入口，原入口位置显示禁用态与原因 tooltip（禁用态与原因以 `role=\"status\"` 呈现，仅在状态变化时播报）；同一产物拖入 ComfyUI 引擎的 H3 任务作首帧则正常可用。"},{"id":"A33","source":"specs/mmh3-engine-integration/spec.md","text":"删除与引用检测照常 删除一条 mmh3 视频产物：文件进回收站、记录移除；当它被影片项目引用时删除被阻止并提示引用位置——与 ComfyUI 产物行为一致。"},{"id":"A34","source":"specs/mmh3-engine-integration/spec.md","text":"交接释放 ComfyUI 刚完成一次 H3 生成后立刻选 mmh3 提交：应用先查队列（空）、发 `/free`、等 mmh3 确认可达，然后提交成功；状态行按序显示上述阶段。"},{"id":"A35","source":"specs/mmh3-engine-integration/spec.md","text":"全量回归绿 `pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 在本 change 全部改动下通过；`test-engine-routing.cjs` 门禁逐条通过。"}],"children":null,"formalHash":"29b7df6e855c54707404d6450f476efbf2018357aef428fbe0bb26b03a5381c5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"9ab37e527c306e0acfb388db36ac8c12956cc9a7832bba935726b586ce82150c","contractHash":"c5f756bba2ed05b6865aacf51a3d34a8a6d6c202d05a3b0f1d81c31f1fa60280","inputHash":"63b852c687f3e53cf4656833b69845f20fc8798a46480c8f029dd32ac9fdd5ea","legacyFingerprint":"f120b7cb5344e74a640681dc296335f18905c413745c71d09a95ffaa91cfc593","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"10486058776198b1b352fc0eb0b34e829a9e148ee99012d50dd8060752865677","contractHash":"ef6ca3509e33db2052f39ee5a9183715c11596054f020abd3a31eba3ff841add","inputHash":"d3d9ad493542c65b815894b0d09095e5b3a76d131460e5cdb7becf9c15e354e5","legacyFingerprint":"b150766158d2412c839214c3c3f8b1e1f9638313fe9567c04a30f06f0e92a7ba","source":"specs/mmh3-engine-integration/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"e6db16a25189cb9b4e5040b01cd2289f87da35e7273720fe2ad8880a833ed667","specChanges":[{"capability":"mmh3-engine-integration","operation":"modify","source":"specs/mmh3-engine-integration/spec.md"}]}},{"sequence":5,"value":{"acceptance":[{"id":"A1","source":"brief.md","text":"**A1 真中断（运行中取消，引擎支持时）**：mmh3 视频任务运行中点取消 → 应用调用 `POST /v1/generations/{id}/interrupt` → 卡片状态行显示「正在停止（当前步跑完后生效）」→ 引擎进入 `cancelling` → 终态 `cancelled`：产物不落库、远端副本按既有清理路径处置。实机：新二进制临时实例跑通一次。"},{"id":"A2","source":"brief.md","text":"**A2 排队任务取消**：mmh3 已有任务在跑时再提交一个并点取消 → 引擎直接 `cancelled`、任务不起跑、不占 GPU；卡片显示「未开始执行，已取消」。"},{"id":"A3","source":"brief.md","text":"**A3 末步窗口如实呈现**：取消落在最后一步之后、引擎返回 `done` → 卡片显示完成并保留产物入库，不显示取消成功。"},{"id":"A4","source":"brief.md","text":"**A4 旧引擎降级**：对不支持 interrupt 的实例（常驻旧二进制）点取消 → 沿用既有提示「mmh3 无法中断，仍在占用 GPU」，跑完后产物丢弃不入库；界面不出现原始 HTTP 错误文案。"},{"id":"A5","source":"brief.md","text":"**A5 实例实际权重徽标**：引擎徽标显示实例实际加载的 DiT 与适配器（patch/LoRA 文件名）；主实例与极速实例可据此区分；digest 以「实例口径指纹，非完整性校验」呈现；实例正忙（weights 无 dit 条目）时显示「正忙」而非「异常」或「模型缺失」。"},{"id":"A6","source":"brief.md","text":"**A6 配方以服务端为准**：档位可用性、缺文件提示与画布约束来自 `GET /v1/recipes`；某档缺文件时显示「模型缺失」并指名缺哪个文件、该档不可提交，其余档正常；提交时配方字段原样透传（键名与值不被应用改写）。"},{"id":"A7","source":"brief.md","text":"**A7 turbo8 画布配对**：1344×768 画布下 turbo8 使用 `minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors` + steps 8 + shift-video 6 / shift-audio 3 + attention sol + attention-precision int8-fp8 + sparse-start 0；960×544 画布下 turbo8 使用 turbo8-544p 条目；其他画布不提供 turbo8，且档位选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A8","source":"brief.md","text":"**A8 ETA**：mmh3 任务进度显示按 `step_seconds × 剩余步数` 估算的剩余时间；`step_seconds` 缺失时退回既有展示，不显示错误值。"},{"id":"A9","source":"brief.md","text":"**A9 多锚点 keyframe**：H3 视频提交区可按帧序号添加多个锚点图（选该模式后首帧/尾帧入口不可用并说明原因）；提交时表单带成对的 `keyframe`/`frame-index`；实机抽帧核对锚定帧与锚图一致。"},{"id":"A10","source":"brief.md","text":"**A10 引擎增删**：设置页可新增自定义 mmh3 引擎条目（label/baseUrl/fastBaseUrl）与删除自定义条目（预置 ComfyUI/mmh3 条目不可删，删除前有确认）；新增后 H3 选择器立即可用，删除后回落默认引擎。"},{"id":"A11","source":"brief.md","text":"**A11 切换引擎参数重置**：从 mmh3 切到 ComfyUI（或反之）时，不适用于新引擎的档位与参数重置为该引擎默认值，不带着旧值提交。"},{"id":"A12","source":"brief.md","text":"**A12 提交失败文案（R2）**：提交超时不再呈现原始 `TypeError: fetch failed`，改为带修复指引的失败文案。"},{"id":"A13","source":"brief.md","text":"**A13 引擎选择跨重启（R3）**：应用重启后 H3 两处引擎选择恢复为上次选择，首屏不闪 comfy。"},{"id":"A14","source":"brief.md","text":"**A14 非 H3 零回归与门禁**：`pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 全绿；既有 `scripts/test-engine-routing.cjs` 六条门禁仍 PASS 且新增契约门禁 PASS；其他工作区行为零变化。"},{"id":"A15","source":"specs/mmh3-engine-integration/spec.md","text":"首次启动无新字段 升级后首次启动（设置文件无 `engines`/`activeEngineId`）：H3 选择器默认显示 ComfyUI，其余一切工作区行为与本 change 之前**行为级一致**（行为等价，不做逐字节比对）。"},{"id":"A16","source":"specs/mmh3-engine-integration/spec.md","text":"首启幂等合成 升级后首启（存量设置只有 `comfyUrl`）：合成 `engines=[comfy(镜像), mmh3(默认本机地址)]`、`activeEngineId='comfy'`；再次启动不重复改写；一切非 H3 行为与改动前一致。"},{"id":"A17","source":"specs/mmh3-engine-integration/spec.md","text":"保存单通道 设置页把 `comfyUrl` 从 A 改为 B 保存：一次写盘同时落 `comfyUrl=B` 与 `engines[comfy].baseUrl=B`；反向编辑 comfy 条目 baseUrl 同理；两次保存之间不存在不一致窗口，也不出现第二次写盘提示。"},{"id":"A18","source":"specs/mmh3-engine-integration/spec.md","text":"引擎可见可管理 用户在设置页看到 ComfyUI 与 mmh3 两条预置条目，可改 mmh3 的 baseUrl 指向另一本机端口，保存后 H3 选择器随即使用新地址；不重启应用生效。"},{"id":"A19","source":"specs/mmh3-engine-integration/spec.md","text":"自定义引擎可增删（验收：A10） 设置页新增一条名为「mmh3-实验」的自定义 mmh3 引擎（地址填本机另一端口）：保存后 H3 视频与 H3 生图的引擎选择器出现该条目，状态徽标按其地址独立预检；在设置页删除它并确认：条目消失，若它是当前选择则回落 ComfyUI，预置两条目始终存在且无删除入口。"},{"id":"A20","source":"specs/mmh3-engine-integration/spec.md","text":"离线置灰 停掉本机 `mmh3.service` 后打开 H3 视频工作区：mmh3 选项在数秒内置灰、状态行显示离线原因；ComfyUI 选项不受影响且可正常生成。"},{"id":"A21","source":"specs/mmh3-engine-integration/spec.md","text":"模型缺失 mmh3 可达但实例的模型树缺某配方文件（如 patches 下无 FastH3 patch）：选择器显示 `○ 模型缺失` 并注明缺哪个文件；该档位不可提交，其余档位正常。"},{"id":"A22","source":"specs/mmh3-engine-integration/spec.md","text":"实际权重可见（验收：A5） mmh3 实例可达且空闲：状态行显示该实例实际加载的 DiT 文件名与适配器（如 `fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors` + 其 patch/LoRA）；切到极速档时状态行显示的是 `:8889` 自己的权重而非主实例的；权重指纹旁注明「实例口径指纹，非完整性校验」；实例正在渲染时状态行显示「● 正忙」而非「模型缺失」。"},{"id":"A23","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 4 走 mmh3 选择 mmh3 + Turbo 4 档提交 1344×768/5 秒：请求发往 `http://127.0.0.1:8888/v1/generations`，multipart 含上表字段；完成后媒体库出现带 mmh3 徽标的 MP4。"},{"id":"A24","source":"specs/mmh3-engine-integration/spec.md","text":"fast 档路由第二实例 选择极速 fast 档提交：请求发往 `:8889`；主实例（:8888）不参与该任务；fast 档 UI 标注来源实例。"},{"id":"A25","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 8 画布配对（验收：A7） 画布为 1344×768 时选 Turbo 8：multipart 含 `lora=minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors`、`steps=8`、`shift-video=6`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`（配方快照门禁 G5 断言字段）。画布改为 960×544：Turbo 8 落到 `turbo8-544p` 条目（缺该 LoRA 时显示「模型缺失」并禁用提交）。画布改为 1344×576 或竖屏/方形：Turbo 8 不出现在可选档位中，选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A26","source":"specs/mmh3-engine-integration/spec.md","text":"PDMD 专属档 选择 PDMD 2 步档提交：multipart 含 `lora=minimax_h3_pdmd_2step_lora_rank128_bf16.safetensors`、`steps=2`、`shift-video=12`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`；UI 徽标区分「mmh3 专属」，该档不出现在 ComfyUI 引擎选项中（G5 断言字段 + 实机抽测出片）。"},{"id":"A27","source":"specs/mmh3-engine-integration/spec.md","text":"角色身份图同引擎 角色工作室的身份图批量生成提交点在 mmh3 引擎下按生图路径（§5）分派，不构造 ComfyUI graph。"},{"id":"A28","source":"specs/mmh3-engine-integration/spec.md","text":"mmh3 生图入库 mmh3 引擎下 1024×1024/6 步生图完成：PNG 落地本地 outputDirectory、登记 `GenerationJob`（`provider: 'h3image'`、`engineId: 'mmh3'`）、媒体库可见可删除，与 ComfyUI 生图条目同构。"},{"id":"A29","source":"specs/mmh3-engine-integration/spec.md","text":"排队可见 在 mmh3 已有一个 running 任务时再提交一个：第二个任务卡片显示排队位置；第一个完成后第二个自动开始并正常完成。排队状态以 `role=\"status\"` 呈现并在状态变化时播报一次，不高频刷新。"},{"id":"A30","source":"specs/mmh3-engine-integration/spec.md","text":"真中断不落库（验收：A1、A2、A3） mmh3 任务运行中点取消：卡片转「正在停止（当前步跑完后生效）」，引擎进入 `cancelling` 后转 `cancelled` 终态；服务端完成后媒体库**不**出现该产物，远端副本被清理。若取消落在最后一步之后、引擎已返回 `done`，卡片显示完成并保留产物入库——不谎报取消成功。排队中的任务被取消时直接 `cancelled`、不起跑、不占 GPU。"},{"id":"A31","source":"specs/mmh3-engine-integration/spec.md","text":"旧引擎软取消降级（验收：A4） 对不支持 interrupt 的实例点取消：卡片转取消态并出现「mmh3 无法中断，仍在占用 GPU」提示；服务端完成后媒体库不出现该产物，远端副本被清理；界面不出现原始 HTTP 错误文案。"},{"id":"A32","source":"specs/mmh3-engine-integration/spec.md","text":"降级标注 mmh3 任务的卡片与详情不出现「放大」等操作入口，原入口位置显示禁用态与原因 tooltip（禁用态与原因以 `role=\"status\"` 呈现，仅在状态变化时播报）；同一产物拖入 ComfyUI 引擎的 H3 任务作首帧则正常可用。"},{"id":"A33","source":"specs/mmh3-engine-integration/spec.md","text":"删除与引用检测照常 删除一条 mmh3 视频产物：文件进回收站、记录移除；当它被影片项目引用时删除被阻止并提示引用位置——与 ComfyUI 产物行为一致。"},{"id":"A34","source":"specs/mmh3-engine-integration/spec.md","text":"交接释放 ComfyUI 刚完成一次 H3 生成后立刻选 mmh3 提交：应用先查队列（空）、发 `/free`、等 mmh3 确认可达，然后提交成功；状态行按序显示上述阶段。"},{"id":"A35","source":"specs/mmh3-engine-integration/spec.md","text":"全量回归绿 `pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 在本 change 全部改动下通过；`test-engine-routing.cjs` 门禁逐条通过。"}],"children":null,"formalHash":"29b7df6e855c54707404d6450f476efbf2018357aef428fbe0bb26b03a5381c5","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"9ab37e527c306e0acfb388db36ac8c12956cc9a7832bba935726b586ce82150c","contractHash":"c5f756bba2ed05b6865aacf51a3d34a8a6d6c202d05a3b0f1d81c31f1fa60280","inputHash":"63b852c687f3e53cf4656833b69845f20fc8798a46480c8f029dd32ac9fdd5ea","legacyFingerprint":"f120b7cb5344e