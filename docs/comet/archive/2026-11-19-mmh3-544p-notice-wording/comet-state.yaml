rding","status":"succeeded","stepId":"archive.finalize","type":"call_tool"}],"actionContexts":{"mmh3-544p-notice-wording:1":{"results":{},"sequence":1},"mmh3-544p-notice-wording:10":{"results":{},"sequence":10},"mmh3-544p-notice-wording:3":{"results":{},"sequence":3},"mmh3-544p-notice-wording:4":{"results":{},"sequence":4},"mmh3-544p-notice-wording:5":{"results":{},"sequence":5},"mmh3-544p-notice-wording:6":{"results":{},"sequence":6},"mmh3-544p-notice-wording:8":{"results":{},"sequence":8},"mmh3-544p-notice-wording:9":{"results":{},"sequence":9}},"waits":[{"id":"mmh3-544p-notice-wording:2","stepId":"shape.confirm","sequence":2,"status":"resolved","proposal":{"input":{"artifactRootRef":"docs","name":"mmh3-544p-notice-wording","task":"修复 960×544 画布显式选择 turbo8 档时提交通知文案不准确：文案写「回退标准 30 步」，实际行为正确映射到 turbo8-544p（8 步）。只改 src/App.tsx submitMmh3 通知分支的文案，使其如实描述实际配对结果。"},"outputs":{"shape.prepare":{"acceptance":[{"id":"A1","source":"brief.md","text":"A1：960×544 画布显式选择 Turbo 8 并提交：通知说明已配对到 turbo8-544p 变体（含 8 步语义），不出现「回退标准 30 步」表述；提交字段仍为 turbo8-544p 条目（`mmh3TierForCanvas('turbo8', 960, 544) === 'turbo8-544p'` 不回归）。"},{"id":"A2","source":"brief.md","text":"A2：未配对画布（如 1344×576）下带残留 turbo8 选择提交：通知说明已回退到标准配方（引擎默认步数），不固定写「30 步」；提交按 `off` 档进行。"},{"id":"A3","source":"specs/mmh3-engine-integration/spec.md","text":"首次启动无新字段 升级后首次启动（设置文件无 `engines`/`activeEngineId`）：H3 选择器默认显示 ComfyUI，其余一切工作区行为与本 change 之前**行为级一致**（行为等价，不做逐字节比对）。"},{"id":"A4","source":"specs/mmh3-engine-integration/spec.md","text":"首启幂等合成 升级后首启（存量设置只有 `comfyUrl`）：合成 `engines=[comfy(镜像), mmh3(默认本机地址)]`、`activeEngineId='comfy'`；再次启动不重复改写；一切非 H3 行为与改动前一致。"},{"id":"A5","source":"specs/mmh3-engine-integration/spec.md","text":"保存单通道 设置页把 `comfyUrl` 从 A 改为 B 保存：一次写盘同时落 `comfyUrl=B` 与 `engines[comfy].baseUrl=B`；反向编辑 comfy 条目 baseUrl 同理；两次保存之间不存在不一致窗口，也不出现第二次写盘提示。"},{"id":"A6","source":"specs/mmh3-engine-integration/spec.md","text":"引擎可见可管理 用户在设置页看到 ComfyUI 与 mmh3 两条预置条目，可改 mmh3 的 baseUrl 指向另一本机端口，保存后 H3 选择器随即使用新地址；不重启应用生效。"},{"id":"A7","source":"specs/mmh3-engine-integration/spec.md","text":"自定义引擎可增删（验收：A10） 设置页新增一条名为「mmh3-实验」的自定义 mmh3 引擎（地址填本机另一端口）：保存后 H3 视频与 H3 生图的引擎选择器出现该条目，状态徽标按其地址独立预检；在设置页删除它并确认：条目消失，若它是当前选择则回落 ComfyUI，预置两条目始终存在且无删除入口。"},{"id":"A8","source":"specs/mmh3-engine-integration/spec.md","text":"离线置灰 停掉本机 `mmh3.service` 后打开 H3 视频工作区：mmh3 选项在数秒内置灰、状态行显示离线原因；ComfyUI 选项不受影响且可正常生成。"},{"id":"A9","source":"specs/mmh3-engine-integration/spec.md","text":"模型缺失 mmh3 可达但实例的模型树缺某配方文件（如 patches 下无 FastH3 patch）：选择器显示 `○ 模型缺失` 并注明缺哪个文件；该档位不可提交，其余档位正常。"},{"id":"A10","source":"specs/mmh3-engine-integration/spec.md","text":"实际权重可见（验收：A5） mmh3 实例可达且空闲：状态行显示该实例实际加载的 DiT 文件名与适配器（如 `fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors` + 其 patch/LoRA）；切到极速档时状态行显示的是 `:8889` 自己的权重而非主实例的；权重指纹旁注明「实例口径指纹，非完整性校验」；实例正在渲染时状态行显示「● 正忙」而非「模型缺失」。"},{"id":"A11","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 4 走 mmh3 选择 mmh3 + Turbo 4 档提交 1344×768/5 秒：请求发往 `http://127.0.0.1:8888/v1/generations`，multipart 含上表字段；完成后媒体库出现带 mmh3 徽标的 MP4。"},{"id":"A12","source":"specs/mmh3-engine-integration/spec.md","text":"fast 档路由第二实例 选择极速 fast 档提交：请求发往 `:8889`；主实例（:8888）不参与该任务；fast 档 UI 标注来源实例。"},{"id":"A13","source":"specs/mmh3-engine-integration/spec.md","text":"Turbo 8 画布配对（验收：A7） 画布为 1344×768 时选 Turbo 8：multipart 含 `lora=minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors`、`steps=8`、`shift-video=6`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`（配方快照门禁 G5 断言字段）。画布改为 960×544：Turbo 8 落到 `turbo8-544p` 条目（缺该 LoRA 时显示「模型缺失」并禁用提交）。画布改为 1344×576 或竖屏/方形：Turbo 8 不出现在可选档位中，选择处说明该档只支持 1344×768 / 960×544。"},{"id":"A14","source":"specs/mmh3-engine-integration/spec.md","text":"配对结果通知如实（验收：A1、A2） 960×544 画布显式选择 Turbo 8 提交：通知说明已配对到 turbo8-544p 变体（8 步语义），不出现「回退标准 30 步」表述；提交字段仍为 turbo8-544p 条目。未配对画布（如 1344×576）带残留 turbo8 选择提交：通知说明已回退到标准配方（引擎默认步数），不固定写「30 步」；提交按 `off` 档进行。"},{"id":"A15","source":"specs/mmh3-engine-integration/spec.md","text":"PDMD 专属档 选择 PDMD 2 步档提交：multipart 含 `lora=minimax_h3_pdmd_2step_lora_rank128_bf16.safetensors`、`steps=2`、`shift-video=12`、`shift-audio=3`、`attention=sol`、`attention-precision=int8-fp8`、`sparse-start=0`；UI 徽标区分「mmh3 专属」，该档不出现在 ComfyUI 引擎选项中（G5 断言字段 + 实机抽测出片）。"},{"id":"A16","source":"specs/mmh3-engine-integration/spec.md","text":"角色身份图同引擎 角色工作室的身份图批量生成提交点在 mmh3 引擎下按生图路径（§5）分派，不构造 ComfyUI graph。"},{"id":"A17","source":"specs/mmh3-engine-integration/spec.md","text":"mmh3 生图入库 mmh3 引擎下 1024×1024/6 步生图完成：PNG 落地本地 outputDirectory、登记 `GenerationJob`（`provider: 'h3image'`、`engineId: 'mmh3'`）、媒体库可见可删除，与 ComfyUI 生图条目同构。"},{"id":"A18","source":"specs/mmh3-engine-integration/spec.md","text":"排队可见 在 mmh3 已有一个 running 任务时再提交一个：第二个任务卡片显示排队位置；第一个完成后第二个自动开始并正常完成。排队状态以 `role=\"status\"` 呈现并在状态变化时播报一次，不高频刷新。"},{"id":"A19","source":"specs/mmh3-engine-integration/spec.md","text":"真中断不落库（验收：A1、A2、A3） mmh3 任务运行中点取消：卡片转「正在停止（当前步跑完后生效）」，引擎进入 `cancelling` 后转 `cancelled` 终态；服务端完成后媒体库**不**出现该产物，远端副本被清理。若取消落在最后一步之后、引擎已返回 `done`，卡片显示完成并保留产物入库——不谎报取消成功。排队中的任务被取消时直接 `cancelled`、不起跑、不占 GPU。"},{"id":"A20","source":"specs/mmh3-engine-integration/spec.md","text":"旧引擎软取消降级（验收：A4） 对不支持 interrupt 的实例点取消：卡片转取消态并出现「mmh3 无法中断，仍在占用 GPU」提示；服务端完成后媒体库不出现该产物，远端副本被清理；界面不出现原始 HTTP 错误文案。"},{"id":"A21","source":"specs/mmh3-engine-integration/spec.md","text":"降级标注 mmh3 任务的卡片与详情不出现「放大」等操作入口，原入口位置显示禁用态与原因 tooltip（禁用态与原因以 `role=\"status\"` 呈现，仅在状态变化时播报）；同一产物拖入 ComfyUI 引擎的 H3 任务作首帧则正常可用。"},{"id":"A22","source":"specs/mmh3-engine-integration/spec.md","text":"删除与引用检测照常 删除一条 mmh3 视频产物：文件进回收站、记录移除；当它被影片项目引用时删除被阻止并提示引用位置——与 ComfyUI 产物行为一致。"},{"id":"A23","source":"specs/mmh3-engine-integration/spec.md","text":"交接释放 ComfyUI 刚完成一次 H3 生成后立刻选 mmh3 提交：应用先查队列（空）、发 `/free`、等 mmh3 确认可达，然后提交成功；状态行按序显示上述阶段。"},{"id":"A24","source":"specs/mmh3-engine-integration/spec.md","text":"全量回归绿 `pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 在本 change 全部改动下通过；`test-engine-routing.cjs` 门禁逐条通过。"}],"children":null,"formalHash":"d1cdc4299895206583b2fd30a8a3c5dcbce919a41cff3f37d