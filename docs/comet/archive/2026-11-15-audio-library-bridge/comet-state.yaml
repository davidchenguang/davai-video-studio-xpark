      width/height 为 0，该行整体替换）；灯箱 Esc/点击背景可关闭。
    result: passed
    reason:
      text: DOM 实测：卡片 body 内 <audio class="library-card-audio" controls
        preload="metadata"
        src="minimax-media://local?path=audio%2FACE_Step_1.5_1700000300.flac">，src
        与该 job outputUrl 逐字相同，且不在 button.library-card-media 内（媒体按钮内 audio 计数为
        0，媒体区只渲染 Music2 占位图标）；点击卡片播放器后 .media-lightbox 不出现（不冒泡开灯箱）。灯箱
        .media-lightbox-stage audio 的 src 为同一
        outputUrl、controls=true、autoPlay=false、无 video 元素；无
        .opening-frame-builder。卡片 small 行为「42 秒音频」「15 秒音频」「60 秒音频」，灯箱 footer
        为「42 秒音频」，均无「0 × 0 ·」前缀。Esc 关闭灯箱=true，点击背景关闭=true。播放器样式实测 computed
        width=369.25px（=body 宽
        100%）、height=36px、max-width:none（src/styles/creation-workspaces.css:54-55）。播放能力证据等级：浏览器
        mock 环境无 minimax-media 协议处理器，元素 error code 4/ERR_UNKNOWN_URL_SCHEME
        属环境限制；传输层源码 electron/main.ts:105-147 localMediaResponse 对 .flac/.mp3 等返回
        audio MIME（:99-103）+ accept-ranges + 206 content-range，协议注册见 :149-151，并由
