      body，媒体区按钮点击开灯箱，播放器不在按钮内）；「媒体」筛选选「音频」只显示音频条目，选「视频」「图片」时音频不出现；全部提供方 +
      全部媒体下音频可见。
    result: passed
    reason:
      text: 源码：src/components/LibraryView.tsx:21 available 只按 Boolean(job.outputUrl)
        过滤（已移除 mediaType!=='audio'）；:22-23 mediaMatches 改三分支（all 全通过 / image 仅
        image / audio 仅 audio / video 排除 image 与 audio）；:55
        媒体下拉为「全部媒体/视频/图片/音频」。DOM 实测（127.0.0.1:5173 + Playwright，种子含
        acestep/music3/无 provider 三个音频 + 1 视频 + 1 图片）：全部媒体下 5 张卡片、计数「5/ 共 5
        个素材」；媒体筛选选音频→3 张音频、选视频→1 张视频、选图片→1 张图片，三者互不泄漏；全部提供方下音频可见，音频卡片来源标签为裸标签
        ACE-Step / Music 3 /
        音乐。入库链路核对：src/App.tsx:2199-2204(acestep)、:2236-2237(music3) 构造
        mediaType:'audio' 的 job；:1051/1077 完成分支写 outputUrl 与
        localOutputPath；src/lib/workflow.ts:367-397 extractOutputFile 对
        mediaType==='audio' 有专门扩展名白名单(flac/wav/mp3/ogg/m4a/aac/opus)，:400-408
        extractOutputUrl 产出 minimax-media:// 短 URL。
      truncated: false
