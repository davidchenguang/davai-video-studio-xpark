h；:184 「重置歌曲」-> setDraft(fresh())。DOM（CDP，实机 http://127.0.0.1:5199/，导航「音乐 · Music 3」）：select 位于「歌曲设置」/music3-structure-controls 区块内，label 文本「演唱语言」，初值 'zh'。切到 en 后 localStorage 写入原始值 \"language\":\"en\"（字符串，未写入中文显示值）；Page.reload 后重新进入工作区，select 仍为 'en'/English；点击「重置歌曲」后回到 'zh'/中文且 localStorage 为 \"language\":\"zh\"。切换语言不影响其它草稿字段。","result":"passed"},{"id":"A2","reason":"代码：src/lib/music3Workflow.ts:29 MUSIC3_LANGUAGE_LINES = { zh: 'Vocal language: Mandarin Chinese', en: 'Vocal language: English' }；buildMusic3Caption 返回 4 段，顺序为 Global Metadata -> Vocal Language -> Vocal Details -> Arrangement，语言取 sections.language ?? 'zh'（缺省中文）。Node 执行：zh caption = '### Global Metadata\\nm\\n\\n### Vocal Language\\nVocal language: Mandarin Chinese\\n\\n### Vocal Details\\nv\\n\\n### Arrangement\\na'，en 同构为 'Vocal language: English'，省略 language 键时为 'Mandarin Chinese'。DOM：caption 预览 <pre>（与 onGenerate 传入的 caption 同一变量）在中文下含 '### Vocal Language\\nVocal language: Mandarin Chinese\\n\\n### Vocal Details'，切 English 后含 'Vocal language: English'。lyrics 独立通道：music3Workflow.ts:19 以 options.lyrics 与 options.caption 两个不同输入传给 MiniMaxMusic3TextEncode；Music3Workspace.tsx:99 调用 buildMusic3Caption 时根本不传 lyrics，:183 原样传 draft.lyrics。DOM 实证：向歌词框键入含中文与 [Verse] 标签的歌词后字段内容逐字节不变，caption 中既无歌词文本也无 [Verse] 标签。pnpm test:music3-vocabulary PASS（scripts/test-music3-vocabulary.cjs:79-87 断言段数=4、语言段位置在 Global Metadata 与 Vocal Details 之间、zh/en/缺省三态、以及 /[一-鿿]/ 断言提示词层无中文）。","result":"passed"},{"id":"A3","reason":"置顶：src/components/Music3Workspace.tsx:22-27 的 6 个中文预设就是 musicPresets 数组的前 6 个元素（华语流行/Mandopop、国风·古风/Chinese traditional、中文民谣/Folk、中文说唱/Hip-hop、中文 R&B/R&B、中文摇滚/Rock），其后 :28-61 为原有 34 个。DOM：.music3-preset-grid 恰含 40 个按钮，面板标题「40 个预设」，渲染前 10 个标题依次为 华语流行、国风·古风、中文民谣、中文说唱、中文 R&B、中文摇滚、霓虹合成器流行、午夜 R&B、嘉年华浩室、仓库铁克诺 —— 6 个中文预设确为前 6 位且顺序正确。防撞（独立重算）：从 TSX 重新提取 musicPresets 字面量，按 :137 实际使用的 5 字段键（genre+bpm+key+vocals+arrangement）去重，40 个预设 -> 40 个互异键，碰撞数 0（含 metadata/progression 亦为 0）；模拟 activePreset 的 find() 对每个预设求值，误配 0。同流派审