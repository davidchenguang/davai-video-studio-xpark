      Electron/文件系统依赖、副作用注入，主进程先用 relative+isAbsolute 做词法越界判定（根目录本身、..
      前缀、跨盘、Win32/darwin 大小写折叠均拒绝），存在文件再 realpath 复核真实路径，全部路径校验通过后才逐个
      shell.trashItem；逐文件返回 recycled/missing/failed[{path,reason}]，缩略图 .jpg
      unlink 为非致命 best-effort。(2) electron/main.ts 新增
      trustedMediaOutputRoots：可信根 = settings.outputDirectory + ComfyUI
      /system_stats 上报的 --output-directory（复用 observedComfyOutput 600s
      缓存语义），渲染层只传路径不传根；新增 media:delete
      IPC（thumbnailRoot=userData/video-thumbnails），根 2 不可达时错误文案单独提示连接
      ComfyUI。(3) 新增 src/lib/libraryReferences.ts：读取影片项目、续接脚本、帧书签、角色/地点五个存储，URL
      经 playableOutputUrl 归一化并解析 minimax-media path 参数；覆盖续接脚本首段（sourceJobId）、待删
      job 自身 continuation.scriptId 归属（含无子节点尾节拍）、子 job continuation.sourceJobId
      父节点链；key 缺失=无引用，解析失败或顶层结构错误 fail-closed，坏元素跳过；按 spec 不设 latentPath
      匹配器（motionContext 不落盘到 GenerationJob）。(4) App.tsx 新增
      deleteMediaJob：files=[localOutputPath,latentPath,segmentOutputPath]，失败保留记录并如实提示已移动数量/失败文件/原因；成功立即
      persist('minimax.jobs', next.slice(0,100).map(compactJob)) 绕过 1200ms 防抖后再
      setJobs 移除，成功提示区分本机回收/文件已不存在/远程三种。(5) LibraryView 卡片与灯箱新增 danger 删除按钮（单条
      busy 禁用+spinner），确认文案区分本机/远程，灯箱删除先卸载媒体元素并延时到 React 提交后再调用
      IPC，引用命中或数据不可读时显示阻止对话框（不可读提供重试），不调用 IPC。(6) 类型/预加载/browserMock/CSS
      同步补齐。开发期实跑：pnpm typecheck、pnpm lint、pnpm build:web、pnpm
      build:electron、pnpm test:media-deletion 全部通过；pnpm test 链在 test:locale
