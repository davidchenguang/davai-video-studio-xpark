acceptance:
  - id: A1
    source: brief.md
    text: "**A1 变体识别**：`inferAceStepSelections` 能从模型清单认出
      `acestep_v1.5_xl_turbo_bf16.safetensors`；`AceStepModelSelection.turbo`
      为可选字段，既有调用方（`scripts/lib/prompt-parity-harness.cjs`
      的对象字面量）不需要修改即可继续编译与运行。"
    result: pending
    reason: null
  - id: A2
    source: brief.md
    text: "**A2 官方采样参数**：Turbo 图的 KSampler 为 `steps: 8` / `cfg: 1` / `sampler_name:
      'euler'` / `scheduler: 'simple'` / `denoise: 1`，`ModelSamplingAuraFlow` 为
      `shift: 3`，`TextEncodeAceStepAudio1.5` 为 `cfg_scale: 2` / `temperature:
      0.85` / `top_p: 0.9` / `top_k: 0` / `min_p: 0`；Base 为 `steps: 50` / `cfg:
      6` / `top_p: 0.9`；SFT 为 `steps: 50` / `cfg: 7` / `top_p: 1`。三者与 Comfy-Org
      官方模板逐项一致。"
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: "**A3 SFT 不回归**：SFT 生成的图与改动前**逐字节一致**（`pnpm test:prompt-parity` 仍 PASS，基线
      ref 仍是 `6a600eb`）。Base 仅 `top_p` 由 1 改为官方的 0.9 —— 这是本轮**显式确认的行为变更**（同样种子下
      Base 的产出与改动前不同）。"
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: "**A4 选择器与文案**：**SFT 与 Turbo 都在位时**工作区展示 **XL SFT** 与 **XL Turbo**
      两张卡，副标题分别为「指令微调 · 官方 CFG 7」与「蒸馏加速 · 官方 8 步 · 无 CFG」；就绪 /
      缺失徽标沿用现有规则；顶部提示改为「选择 XL SFT 或 XL Turbo。音乐设置与历史独立于视频项目。」；生成摘要行显示真实步数（如 `XL
      TURBO · 8 步 Euler · FLAC`）。**只有 Turbo 在位时**：SFT 卡以「缺失」徽标呈现且不可选、Turbo
      卡就绪、Base 卡不露出、默认选中 Turbo。"
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: "**A5 Base 兜底与默认选择**：只有在 SFT 与 Turbo **都缺失**时才动态露出 XL Base 卡并在标题区提示「仅检测到
      XL Base」（此时 SFT 与 Turbo 两张常驻卡仍以「缺失」徽标呈现）；「首个可用变体」优先级为 sft → turbo →
      base；旧存档 `model: 'base'` 在 Base 不再可选时迁移到首个可用变体，在 Base 恰为唯一可用时保留。"
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: "**A6 提交路径、工作流导出与任务元数据**：设置里的「**ComfyUI 工作流导出**」用首个可用变体构造 ACE-Step 图（当前写死
      `ace.sft ? 'sft' : 'base'`，在只有 Turbo 在位的机器上会导出 `unet_name` 为空字符串的坏图——修正后导出
      `unet_name: acestep_v1.5_xl_turbo_bf16.safetensors` 且 `steps:
      8`）；设置里的「测试连接」只做连接与模型清单探测、不构建 ACE-Step 图，本 change 不改它；任务 `execution`
      记录真实扩散模型文件名与「Euler + simple · N 步」；产出前缀沿用
      `audio/ACE_Step_1.5_{variant}_{timestamp}`（turbo 产出为
      `audio/ACE_Step_1.5_turbo_…`）。"
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: "**A7 文档与本地化**：README 的 ACE-Step 1.5 章节列出三个 XL
      权重文件与各自的官方采样参数；应用内安装提示（`src/lib/workspaceTips.ts` 第 9 条）同样列出 Turbo
      权重文件名；`docs/locale/keep-english.md` 增加 `XL Turbo` 豁免行；`pnpm test:locale`
      报告 0 处问题。"
    result: pending
    reason: null
  - id: A8
    source: brief.md
    text: "**A8 回归**：新增 `scripts/test-ace-step.cjs` 覆盖变体表取值、Turbo 识别、三张图关键参数、SFT
      图不回归、可用变体与兜底选择逻辑（含「仅 Turbo 在位」「仅 Base 在位」两种组合），并接入 `package.json` 的 `test`
      链；`pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 全部通过。"
    result: pending
    reason: null
  - id: A9
    source: brief.md
    text: "**A9 端到端**：在 GB10（`192.168.20.80:8188`）上真实跑通一条 XL Turbo（10 秒）：出音正常、采样确实为
      8 步、产出为 FLAC、任务 `execution` 记录与所选变体一致；生成的 FLAC
      拷回本机供试听。**「进度条不静止」不在本验收项内**：阶段化进度由另一个
      change（`comfy-progress-truthfulness`）提供，尚未落地到本分支；若届时已落地并
      rebase，则附带记录实际进度分布（Turbo 只有 8 步采样，采样阶段会快速前进）。"
    result: pending
    reason: null
