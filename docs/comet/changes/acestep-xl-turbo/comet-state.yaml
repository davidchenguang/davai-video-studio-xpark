` 第 9 条）同样列出 Turbo 权重文件名；`docs/locale/keep-english.md` 增加 `XL Turbo` 豁免行；`pnpm test:locale` 报告 0 处问题。"},{"id":"A8","source":"brief.md","text":"**A8 回归**：新增 `scripts/test-ace-step.cjs` 覆盖变体表取值、Turbo 识别、三张图关键参数、SFT 图不回归、可用变体与兜底选择逻辑（含「仅 Turbo 在位」「仅 Base 在位」两种组合），并接入 `package.json` 的 `test` 链；`pnpm typecheck && pnpm lint && pnpm test && pnpm build:web` 全部通过。"},{"id":"A9","source":"brief.md","text":"**A9 端到端**：在 GB10（`192.168.20.80:8188`）上真实跑通一条 XL Turbo（10 秒）：出音正常、采样确实为 8 步、产出为 FLAC、任务 `execution` 记录与所选变体一致；生成的 FLAC 拷回本机供试听。**「进度条不静止」不在本验收项内**：阶段化进度由另一个 change（`comfy-progress-truthfulness`）提供，尚未落地到本分支；若届时已落地并 rebase，则附带记录实际进度分布（Turbo 只有 8 步采样，采样阶段会快速前进）。"}],"children":null,"formalHash":"624d74643dfdd2cdc32fd759deab5b785ae79a24adac66d483a6770af071849c","semanticSnapshot":{"artifacts":[{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"56eceec78ed2b983cda348dffff2ff1fccf376e2178abeb50dd208a9e9fcd552","contractHash":"f482f418ce3a8fcf1108a345673d384c243358a3126b997e5af87a3d5e04e650","inputHash":"0798b5f8403231d12691771f929cb2d78520447d52795269b6f32e052cdac0c8","legacyFingerprint":"75155a826a7e9ee5d01f04c83afcf39924a77a20d66b01a4cfd04fc90dfb71df","source":"brief.md"},{"auxiliary":[],"commentsHash":"cda738d4fb7d0dbdff20df1cd09b859740e0671de31bcf78b8ddc8ff818dab92","contentHash":"76d1bb84ffc8d4586615224c0057867c057cf27d0cb7291b192aba99cd23e317","contractHash":"e9d54705098f1d2a6e22107c0ac44f93ec6c85cb927223adcfdd77f089bc1976","inputHash":"3bfa0e91b60d118d6edc315a384b71a5b5d54c9ca53c5e6dfd19eab2d8751192","legacyFingerprint":"dca65588a94935064c5383825d47a95818337aa8804d86bbc008b7d471f537a9","source":"specs/acestep-xl-turbo/spec.md"}],"schema":"comet.native.shape-semantics.v1"},"shapeConfirmationHash":"cc33b3dac8a922c47dc0eb65df391b92597a5e34202b0738fc1f643024c93fe3","specChanges":[{"capability":"acestep-xl-turbo","operation":"create","source":"specs/acestep-xl-turbo/spec.md"}]},"status":"succeeded"},"protocolVersion":1